name: TEST Release

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@1c6283577ea8eabcda150cb4f2a9749b3c610b1d  # v1.24.1
    with:
      charts-dir: 'chart'
      dry-run: true
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@1c6283577ea8eabcda150cb4f2a9749b3c610b1d  # v1.24.1
    with:
      dry-run: true
