name: Lint Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/actionlint.yml@578d91388a3f7862fb51c4d2e685586a4d7d1daf  # v1.20.3
  commitlint:
    permissions:
      contents: read
      pull-requests: read  # required to fetch PR metadata
    uses: joeckr/ci-templates/.github/workflows/commitlint.yml@578d91388a3f7862fb51c4d2e685586a4d7d1daf  # v1.20.3
  shellcheck:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/shellcheck.yml@578d91388a3f7862fb51c4d2e685586a4d7d1daf  # v1.20.3
