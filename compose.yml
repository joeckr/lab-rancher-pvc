services:
  lab-service:
    container_name: lab-service
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=lab
      - LOG_LEVEL=debug
    volumes:
      - lab-data:/tmp/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lab-data:
    driver: local
