{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "pvc-rancher.namespace" . }}
  labels:
    {{- include "pvc-rancher.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurity.enforce | quote }}
    pod-security.kubernetes.io/enforce-version: {{ .Values.namespace.podSecurity.enforceVersion | quote }}
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurity.audit | quote }}
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurity.warn | quote }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.namespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
